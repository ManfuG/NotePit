plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'io.notepit.app'
    compileSdk 36
    useLibrary 'android.test.mock', false
    defaultConfig {
        applicationId 'io.notepit.app'
        minSdk 26
        targetSdk 36
        versionCode 8
        versionName '0.4.4'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { compose true; buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    sourceSets.main.assets.srcDirs = ['../../dist']
    packaging { resources.excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/LICENSE.md', 'META-INF/LICENSE-notice.md'] }
    signingConfigs {
        release {
            if (System.getenv('NOTEPIT_KEYSTORE')) {
                storeFile file(System.getenv('NOTEPIT_KEYSTORE'))
                storePassword System.getenv('NOTEPIT_STORE_PASSWORD')
                keyAlias 'notepit'
                keyPassword System.getenv('NOTEPIT_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('NOTEPIT_KEYSTORE')) signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.10.01')
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.22.0'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'io.github.michaldvorak-gemalto:jp2-android:1.0.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation platform('androidx.compose:compose-bom:2025.10.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
